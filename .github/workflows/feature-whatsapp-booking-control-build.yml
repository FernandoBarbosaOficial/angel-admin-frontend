name: Feature WhatsApp Booking Control Frontend Build

on:
  push:
    branches:
      - feature/whatsapp-booking-operational-control
  pull_request:
    branches:
      - staging-multicliente-canais

permissions:
  contents: read

jobs:
  frontend-build:
    if: github.head_ref == 'feature/whatsapp-booking-operational-control' || github.ref == 'refs/heads/feature/whatsapp-booking-operational-control'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Static operational-control smoke
        run: node scripts/booking-operational-control-static-smoke.mjs
      - name: Realtime regression smoke
        run: npm run smoke:operation-realtime
